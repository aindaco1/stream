<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Dust Wave Stream</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body data-checkout="{{checkout}}" data-rent="{{rent}}" data-buy="{{buy}}" data-rental-hours="{{rentalHours}}" data-preview="{{preview}}" data-published="{{published}}" data-email-recovery="{{emailRecovery}}">
  <main aria-labelledby="film-title">
    <video controls playsinline preload="none" aria-label="{{title}}"></video>
    <div class="details">
      <div><h1 id="film-title">{{title}}</h1><p>Dust Wave Stream · Playback prototype</p></div>
      <button type="button" id="play">Play {{preview}}-second preview</button>
    </div>
    <section id="purchase" aria-label="Film offers" hidden>
      <p id="terms"></p>
      <div class="actions">
        <button type="button" id="rent" hidden>Rent</button>
        <button type="button" id="buy" hidden>Buy</button>
        <button type="button" id="check-payment" class="secondary" hidden>Check payment</button>
      </div>
    </section>
    <section id="payment" aria-labelledby="checkout-heading" hidden>
      <div id="checkout-scroll">
        <header class="payment-header">
          <div class="payment-nav"><h2 id="checkout-heading" tabindex="-1">{{title}}</h2>
            <button type="button" id="close-checkout">Back to film</button></div>
          <div class="order-line"><p id="order-terms"></p><strong id="order-price"></strong></div>
        </header>
        <div id="payment-feedback"></div>
        <div id="stripe-checkout"></div>
        <form id="card-form" hidden>
          <div id="contact-element"></div>
          <div id="payment-element"></div>
          <p id="payment-error" role="alert" tabindex="-1" hidden></p>
        </form>
      </div>
      <div class="payment-action">
        <button type="submit" form="card-form" id="confirm-payment" disabled>Pay</button>
        <p class="payment-credit">Dust Wave Stream · All sales are final · Payments by Stripe</p>
      </div>
    </section>
    <section id="ownership" aria-label="Your purchase" hidden>
      <form id="download" method="post"><input type="hidden" name="receipt"><button>Download film</button></form>
    </section>
    <section id="access-tools" aria-label="Your access" hidden>
      <p id="rental-end"></p>
      <details><summary id="save-label">Save purchase link</summary>
        <p>Keep this link private. Anyone who has it can use your access.</p>
        <label for="access-link">Private purchase link</label>
        <div class="actions"><input id="access-link" type="text" readonly autocomplete="off" spellcheck="false">
          <button type="button" class="secondary" id="copy-link">Copy link</button></div>
      </details>
    </section>
    <div id="email-return" hidden><button id="redeem-link" type="button">Restore and watch</button></div>
    <details id="restore-tools" hidden><summary>Restore film access</summary>
      <form id="restore-form"><label for="restore-email">Email used at checkout</label>
        <input id="restore-email" type="email" name="email" autocomplete="email" required maxlength="254">
        <button>Send access link</button></form>
      <p id="restore-feedback" role="status"></p>
    </details>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
