<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Test rental · {{title}}</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/checkout.js"></script>
</head>
<body class="checkout-page" data-page="pay">
  <main>
    <p>Dust Wave Stream · Sandbox checkout</p>
    <h1>Rent {{title}}</h1>
    <p>$0.99 USD for 48 hours from purchase. Use a Stripe test card.</p>
    <p id="status" role="status">Opening Stripe test checkout…</p>
    <div class="actions">
      <button id="retry" type="button" hidden>Try checkout again</button>
      <a id="return-film" hidden>Return to film</a>
    </div>
  </main>
</body>
</html>
