name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Install FFmpeg if needed
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Rehearse filmmaker setup in the runner's Chrome
        env:
          STREAM_BROWSER_CHANNEL: chrome
        run: npm run check:setup
      - name: Rehearse two-film viewer checkout in the runner's Chrome
        env:
          STREAM_BROWSER_CHANNEL: chrome
        run: |
          npm run fixture
          npm run check:viewer-checkout
